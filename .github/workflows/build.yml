name: Build

on:
  push:
    tags:
      - 'v*'         # runs on version tags like v1.0.0 or v1.0.0-beta1
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    if: github.event_name == 'push'   # only run on tag pushes, not manual triggers
    strategy:
      fail-fast: false   # if one platform fails, keep building the others
      matrix:
        include:
          - os: macos-14        # Apple Silicon (M1/M2 runner)
            artifact: Flashback-macOS-AppleSilicon
          - os: windows-latest
            artifact: Flashback-Windows
          - os: ubuntu-22.04
            artifact: Flashback-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-build.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev xvfb libglib2.0-0 libgl1 libfuse2

      - name: Install Python dependencies
        run: pip install -r requirements-build.txt

      - name: Build with PyInstaller (macOS & Windows)
        if: runner.os != 'Linux'
        env:
          PYTHONUTF8: "1"   # Windows CP1252 can't print special chars — force UTF-8
          FLASHBACK_VERSION: ${{ github.ref_name }}
        run: pyinstaller Flashback.spec

      - name: Build with PyInstaller (Linux — needs virtual display)
        if: runner.os == 'Linux'
        env:
          FLASHBACK_VERSION: ${{ github.ref_name }}
        run: xvfb-run pyinstaller Flashback.spec

      # ── macOS: DMG ──────────────────────────────────────────────
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Flashback One35 v2" \
            --volicon "assets/icons/icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Flashback One35.app" 150 185 \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "${{ matrix.artifact }}.dmg" \
            "dist/Flashback One35.app"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.dmg
          retention-days: 14

      # ── Windows: Inno Setup installer ───────────────────────────
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Create installer (Windows)
        if: runner.os == 'Windows'
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" packaging\flashback.iss

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Flashback-Windows
          path: packaging/Output/Flashback-Windows-Setup.exe
          retention-days: 14

      # ── Linux: AppImage ─────────────────────────────────────────
      - name: Create AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          FLASHBACK_VERSION: ${{ github.ref_name }}
        run: |
          # Build the AppDir from PyInstaller output
          APPDIR="Flashback_One35.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Move PyInstaller output into AppDir
          cp -r "dist/Flashback One35"/* "$APPDIR/usr/bin/"

          # Desktop file and icon
          cp packaging/flashback.desktop "$APPDIR/flashback.desktop"
          cp assets/icons/icon.png "$APPDIR/flashback.png"
          cp assets/icons/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/flashback.png"

          # AppRun launcher
          printf '#!/bin/bash\nSELF="$(readlink -f "$0")"\nHERE="${SELF%%/*}"\nexec "${HERE}/usr/bin/Flashback One35" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # Download appimagetool
          curl -sL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool

          # Build the AppImage
          ARCH=x86_64 ./appimagetool "$APPDIR" "Flashback-Linux.AppImage"

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Flashback-Linux
          path: Flashback-Linux.AppImage
          retention-days: 14

  # Runs after all 3 platform builds succeed — only on version tags
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # needed to create releases and upload files

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
          body: |
            ### Downloads
            | Platform | File |
            |---|---|
            | macOS (Apple Silicon — M1/M2/M3/M4) | [`Flashback-macOS-AppleSilicon.dmg`](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Flashback-macOS-AppleSilicon.dmg) |
            | Windows | [`Flashback-Windows-Setup.exe`](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Flashback-Windows-Setup.exe) |
            | Linux | [`Flashback-Linux.AppImage`](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Flashback-Linux.AppImage) |
          generate_release_notes: true
          draft: false
          # Tags containing -beta or -rc are automatically marked as pre-release
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
