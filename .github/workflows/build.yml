name: Build

on:
  push:
    tags:
      - 'v*'         # runs on version tags like v1.0.0 or v1.0.0-beta1
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    if: github.event_name == 'push'   # only run on tag pushes, not manual triggers
    strategy:
      fail-fast: false   # if one platform fails, keep building the others
      matrix:
        include:
          - os: macos-14        # Apple Silicon (M1/M2 runner)
            artifact: LoFiLogic-macOS
          - os: windows-latest
            artifact: LoFiLogic-Windows
          - os: ubuntu-22.04
            artifact: LoFiLogic-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-build.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev xvfb libglib2.0-0 libgl1 libfuse2

      - name: Install Python dependencies
        run: pip install -r requirements-build.txt

      - name: Build with PyInstaller (macOS & Windows)
        if: runner.os != 'Linux'
        env:
          PYTHONUTF8: "1"   # Windows CP1252 can't print special chars — force UTF-8
          LOFILOGIC_VERSION: ${{ github.ref_name }}
        run: pyinstaller LoFiLogic.spec

      - name: Build with PyInstaller (Linux — needs virtual display)
        if: runner.os == 'Linux'
        env:
          LOFILOGIC_VERSION: ${{ github.ref_name }}
        run: xvfb-run pyinstaller LoFiLogic.spec

      # ── macOS: DMG ──────────────────────────────────────────────
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        env:
          LOFILOGIC_VERSION: ${{ github.ref_name }}
        run: |
          brew install create-dmg
          # Must match the versioned name produced by LoFiLogic.spec
          # ("LoFi Logic <version>.app"). Strip the leading 'v'
          # from the tag the same way the spec does.
          VERSION="${LOFILOGIC_VERSION#v}"
          APP_NAME="LoFi Logic ${VERSION}.app"
          DMG_NAME="${{ matrix.artifact }}-${VERSION}.dmg"
          create-dmg \
            --volname "LoFi Logic ${VERSION}" \
            --volicon "assets/icons/icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_NAME}" 150 185 \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "${DMG_NAME}" \
            "dist/${APP_NAME}"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-*.dmg
          retention-days: 14

      # ── Windows: Inno Setup installer ───────────────────────────
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Create installer (Windows)
        if: runner.os == 'Windows'
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" packaging\lofilogic.iss

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LoFiLogic-Windows
          # Filename is versioned (LoFiLogic-Windows-Setup-<ver>.exe) so two
          # parallel releases never overwrite each other in artifact storage.
          path: packaging/Output/LoFiLogic-Windows-Setup-*.exe
          retention-days: 14

      # ── Linux: AppImage ─────────────────────────────────────────
      - name: Create AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          LOFILOGIC_VERSION: ${{ github.ref_name }}
        run: |
          # Build the AppDir from PyInstaller output
          APPDIR="LoFiLogic.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Move PyInstaller output into AppDir
          cp -r "dist/LoFi Logic"/* "$APPDIR/usr/bin/"

          # Drop the bundled C++ runtime so the host's is used. Mesa's Vulkan
          # driver (RADV) links against the system libstdc++/libgcc; the copies
          # PyInstaller bundles (built here on ubuntu-22.04) are older than
          # SteamOS/modern Mesa, and because the loader searches the bundle
          # dir first they shadow the system ones. RADV then fails to load
          # ("GLIBCXX_3.4.xx not found", loader_icd_scan failure) and the app
          # silently falls back to the CPU. Removing them lets the host's newer
          # runtime drive the GPU. Floor becomes "system libstdc++ >= the build
          # host's" — covers the Steam Deck and all current desktop distros.
          find "$APPDIR/usr/bin" \( -name 'libstdc++.so.6*' -o -name 'libgcc_s.so.1*' \) -delete

          # Desktop file and icon
          cp packaging/lofilogic.desktop "$APPDIR/lofilogic.desktop"
          cp assets/icons/icon.png "$APPDIR/lofilogic.png"
          cp assets/icons/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/lofilogic.png"

          # AppRun launcher. HERE must be the directory of the mounted AppRun,
          # so use dirname — `${SELF%%/*}` (greedy) wrongly strips everything to
          # an empty string for an absolute path, making the AppImage exec the
          # host's /usr/bin instead of its own and fail to launch on every Linux.
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "${HERE}/usr/bin/LoFi Logic" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # Download appimagetool
          curl -sL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool

          # Build the AppImage with a versioned filename so parallel
          # releases never collide in the user's Downloads folder.
          VERSION="${LOFILOGIC_VERSION#v}"
          ARCH=x86_64 ./appimagetool "$APPDIR" "LoFiLogic-Linux-${VERSION}.AppImage"

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LoFiLogic-Linux
          path: LoFiLogic-Linux-*.AppImage
          retention-days: 14

  # Runs after all 3 platform builds succeed — only on version tags
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # needed to create releases and upload files

    steps:
      - name: Checkout repository
        # Needed so the release-notes step can read CHANGELOG.md at the
        # tagged commit. Shallow clone is fine — we only read one file.
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Strip the leading 'v' from the tag so the URL matches the
      # versioned installer filename produced by Inno Setup
      # (LoFiLogic-Windows-Setup-<ver>.exe).
      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build release notes
        env:
          VER: ${{ steps.ver.outputs.version }}
          REF: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "### Downloads"
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| macOS (Apple Silicon — M1/M2/M3/M4) | [\`LoFiLogic-macOS-${VER}.dmg\`](${REPO_URL}/releases/download/${REF}/LoFiLogic-macOS-${VER}.dmg) |"
            echo "| Windows | [\`LoFiLogic-Windows-Setup-${VER}.exe\`](${REPO_URL}/releases/download/${REF}/LoFiLogic-Windows-Setup-${VER}.exe) |"
            echo "| Linux | [\`LoFiLogic-Linux-${VER}.AppImage\`](${REPO_URL}/releases/download/${REF}/LoFiLogic-Linux-${VER}.AppImage) |"
            echo ""
            # Extract the section in CHANGELOG.md whose heading matches the
            # version. Heading format: "## <version> — <date>". If no match,
            # the release notes simply omit the changelog block.
            if grep -q "^## ${VER}\b" CHANGELOG.md; then
              echo "### Changelog"
              echo ""
              awk -v ver="^## ${VER}( |$)" '
                $0 ~ ver { found=1; next }
                found && /^## / { exit }
                found { print }
              ' CHANGELOG.md
            fi
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
          body_path: release-notes.md
          draft: false
          # Tags containing -beta or -rc are automatically marked as pre-release
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
