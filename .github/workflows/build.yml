name: Build

on:
  push:
    tags:
      - 'v*'         # runs on version tags like v1.0.0
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon (M1/M2 runner)
            artifact: Flashback-macOS
          - os: windows-latest
            artifact: Flashback-Windows
          - os: ubuntu-22.04
            artifact: Flashback-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libraw-dev

      - name: Install Python dependencies
        run: pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller Flashback.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 14
