name: Build

on:
  push:
    tags:
      - 'v*'         # runs on version tags like v1.0.0 or v1.0.0-beta1
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    if: github.event_name == 'push'   # only run on tag pushes, not manual triggers
    strategy:
      fail-fast: false   # if one platform fails, keep building the others
      matrix:
        include:
          - os: macos-14        # Apple Silicon (M1/M2 runner)
            artifact: Flashback-macOS
          - os: windows-latest
            artifact: Flashback-Windows
          - os: ubuntu-22.04
            artifact: Flashback-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-build.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev xvfb libglib2.0-0 libgl1

      - name: Install Python dependencies
        run: pip install -r requirements-build.txt

      - name: Build with PyInstaller (macOS & Windows)
        if: runner.os != 'Linux'
        env:
          PYTHONUTF8: "1"   # Windows CP1252 can't print ✓ — force UTF-8
        run: pyinstaller Flashback.spec

      - name: Build with PyInstaller (Linux — needs virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run pyinstaller Flashback.spec

      - name: Zip build output (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../Flashback-macOS.zip "Flashback One35.app"

      - name: Zip build output (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist\Flashback One35" -DestinationPath Flashback-Windows.zip

      - name: Zip build output (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r ../Flashback-Linux.zip "Flashback One35"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Flashback-macOS
          path: Flashback-macOS.zip
          retention-days: 14

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Flashback-Windows
          path: Flashback-Windows.zip
          retention-days: 14

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Flashback-Linux
          path: Flashback-Linux.zip
          retention-days: 14

  # Runs the app on your local Mac for interactive testing — trigger manually
  test-local:
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Launch app for manual testing
        run: |
          cd $GITHUB_WORKSPACE
          source venv/bin/activate
          python main.py

  # Runs after all 3 platform builds succeed — only on version tags
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # needed to create releases and upload files

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          # Tags containing -beta or -rc are automatically marked as pre-release
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
